name: Build original Black Bell v3 Gothic mesh
on:
  push:
    paths:
      - Tools/generate_blackbell_v3_detail.py
      - .github/workflows/build-blackbell-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free source geometry dependencies
        run: python -m pip install "numpy>=2.0,<3.0"
      - name: Generate version 3 original OBJ
        run: python Tools/generate_blackbell_v3_detail.py
      - name: Confirm real model extension
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path('Content/Art/HeroProps/SM_BlackBell_Hero_v3.json')
          m=json.loads(a.read_text())
          assert m['new_triangles'] > 30000,m
          assert m['new_vertices'] > 18000,m
          assert Path('Content/Art/HeroProps/SM_BlackBell_Hero_v3.obj').stat().st_size > 19000000
          print('PASS original mesh',m)
          PY
      - name: Save generated original mesh to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Content/Art/HeroProps/SM_BlackBell_Hero_v3.obj Content/Art/HeroProps/SM_BlackBell_Hero_v3.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: generate Black Bell v3 real Gothic geometry [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
