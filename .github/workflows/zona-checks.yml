name: ZONA gameplay checks
on:
  push:
    paths: ['razlom-zona/**', '.github/workflows/zona-checks.yml']
  pull_request:
    paths: ['razlom-zona/**', '.github/workflows/zona-checks.yml']
permissions:
  contents: read
jobs:
  bunker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: razlom-zona
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_project.py
      - name: Install Godot 4.4.1
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --audio-driver Dummy --import
      - run: XDG_DATA_HOME="$(mktemp -d)" godot --headless --fixed-fps 60 -s tests/bunker_walk.gd
      - run: XDG_DATA_HOME="$(mktemp -d)" godot --headless --fixed-fps 60 -s tests/village_walk.gd
      - name: Verify multi-touch ownership in headless Godot
        run: XDG_DATA_HOME="$(mktemp -d)" godot --headless --fixed-fps 60 -s tests/mobile_controls_smoke.gd
      - name: Validate original checkpoint geometry
        run: XDG_DATA_HOME="$(mktemp -d)" godot --headless --fixed-fps 60 -s tests/rift_gate_smoke.gd
      - name: Capture player views
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --audio-driver Dummy --resolution 960x540 -s tests/capture_gallery.gd -- --touch-ui
      - uses: actions/upload-artifact@v4
        with:
          name: zona-godot-player-views
          path: razlom-zona/captures/*.png
          if-no-files-found: error
