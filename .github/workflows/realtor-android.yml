name: Realtor AI APK
on:
  workflow_dispatch:
  push:
    branches: [realtorai-build-04]
    paths:
      - "realtor/**"
      - .github/workflows/realtor-android.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: realtor
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir dist
          cp realtor/app/build/outputs/apk/debug/app-debug.apk dist/RealtorAI-1.0-rc1-debug.apk
          (cd dist && sha256sum RealtorAI-1.0-rc1-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RealtorAI-1.0-rc1-Android-debug
          path: dist/
          if-no-files-found: error
      - name: Build and verify the installable release candidate
        working-directory: realtor
        run: |
          gradle --no-daemon :app:assemblePreview
          mkdir -p ../candidate
          cp app/build/outputs/apk/preview/app-preview.apk ../candidate/RealtorAI-1.0-rc1.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs ../candidate/RealtorAI-1.0-rc1.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging ../candidate/RealtorAI-1.0-rc1.apk > ../candidate/manifest.txt
          grep -F "package: name='ru.vladis.realtorai.preview'" ../candidate/manifest.txt
          grep -E "^native-code: 'arm64-v8a'[[:space:]]*$" ../candidate/manifest.txt
          if grep -Fx 'application-debuggable' ../candidate/manifest.txt; then exit 1; fi
          (cd ../candidate && sha256sum RealtorAI-1.0-rc1.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RealtorAI-1.0-rc1
          path: candidate/
          if-no-files-found: error
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Room and capture the running application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          script: bash realtor/ci/test-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealtorAI-emulator
          path: |
            captures/
            reports/
          if-no-files-found: error
  signed-release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'realtorai-build-04' }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check for production keystore
        id: signing
        env:
          KEYSTORE_DATA: ${{ secrets.REALTOR_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_DATA" ]]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.configured == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Build with the permanent production certificate
        if: steps.signing.outputs.configured == 'true'
        working-directory: realtor
        env:
          KEYSTORE_DATA: ${{ secrets.REALTOR_SIGNING_KEYSTORE_BASE64 }}
          REALTOR_SIGNING_STORE_PASSWORD: ${{ secrets.REALTOR_SIGNING_STORE_PASSWORD }}
          REALTOR_SIGNING_ALIAS: ${{ secrets.REALTOR_SIGNING_ALIAS }}
          REALTOR_SIGNING_KEY_PASSWORD: ${{ secrets.REALTOR_SIGNING_KEY_PASSWORD }}
        run: |
          umask 077
          export REALTOR_SIGNING_STORE="$(mktemp "$RUNNER_TEMP/realtor.XXXXXXXX")"
          trap 'rm -f "$REALTOR_SIGNING_STORE"' EXIT
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$REALTOR_SIGNING_STORE"
          unset KEYSTORE_DATA
          test -n "$REALTOR_SIGNING_STORE_PASSWORD" && test -n "$REALTOR_SIGNING_ALIAS" && test -n "$REALTOR_SIGNING_KEY_PASSWORD"
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
          gradle --no-daemon :app:assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/RealtorAI-1.0-rc1-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ../release/RealtorAI-1.0-rc1-signed.apk
          (cd ../release && sha256sum RealtorAI-1.0-rc1-signed.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: RealtorAI-1.0-rc1-signed
          path: release/
          if-no-files-found: error
