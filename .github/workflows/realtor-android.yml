name: Realtor AI APK
on:
  workflow_dispatch:
    inputs:
      production:
        description: Require a verified production APK
        type: boolean
        default: false
  push:
    branches: [realtorai-build-04]
    paths:
      - "realtor/**"
      - .github/workflows/realtor-android.yml
permissions:
  contents: read
jobs:
  office:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify office permissions and durable synchronization
        working-directory: realtor/office
        run: python3 -m unittest -v
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: realtor
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir dist
          cp realtor/app/build/outputs/apk/debug/app-debug.apk dist/RealtorAI-1.0-rc13-debug.apk
          (cd dist && sha256sum RealtorAI-1.0-rc13-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RealtorAI-1.0-rc13-Android-debug
          path: dist/
          if-no-files-found: error
      - name: Build and verify the installable release candidate
        working-directory: realtor
        run: |
          gradle --no-daemon :app:assemblePreview
          mkdir -p ../candidate
          cp app/build/outputs/apk/preview/app-preview.apk ../candidate/RealtorAI-1.0-rc13.apk
          bash ci/verify-apk.sh ../candidate/RealtorAI-1.0-rc13.apk ru.vladis.realtorai.preview13 1.0-rc13
          unzip -p ../candidate/RealtorAI-1.0-rc13.apk assets/moscow-boundaries.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert all(d[name] for name in ("moscow","oblast","new-moscow"))'
          unzip -p ../candidate/RealtorAI-1.0-rc13.apk assets/mkad.json | python3 -c 'import json,sys; assert len(json.load(sys.stdin)) > 100'
          (cd ../candidate && sha256sum RealtorAI-1.0-rc13.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RealtorAI-1.0-rc13
          path: candidate/
          if-no-files-found: error
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Room and capture the running application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          script: bash realtor/ci/test-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealtorAI-emulator
          path: |
            captures/
            reports/
          if-no-files-found: error
  signed-release:
    if: ${{ github.ref_name == 'realtorai-build-04' }}
    needs: [android, office]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check production signing configuration
        id: signing
        env:
          REQUIRE_PRODUCTION: ${{ inputs.production }}
          KEYSTORE_DATA: ${{ secrets.REALTOR_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REALTOR_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REALTOR_SIGNING_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REALTOR_SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.REALTOR_SIGNING_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE_DATA$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD$SIGNING_CERT_SHA256" &&
                "$REQUIRE_PRODUCTION" != true ]]; then
            echo 'No production signing settings. Only the separate test APK was built.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$KEYSTORE_DATA" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ||
                -z "$KEY_PASSWORD" || ! "$SIGNING_CERT_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "::error::Production signing requires the four keystore secrets and REALTOR_SIGNING_CERT_SHA256."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.signing.outputs.configured == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Build with the permanent production certificate
        if: steps.signing.outputs.configured == 'true'
        working-directory: realtor
        env:
          KEYSTORE_DATA: ${{ secrets.REALTOR_SIGNING_KEYSTORE_BASE64 }}
          REALTOR_SIGNING_STORE_PASSWORD: ${{ secrets.REALTOR_SIGNING_STORE_PASSWORD }}
          REALTOR_SIGNING_ALIAS: ${{ secrets.REALTOR_SIGNING_ALIAS }}
          REALTOR_SIGNING_KEY_PASSWORD: ${{ secrets.REALTOR_SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.REALTOR_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          export REALTOR_SIGNING_STORE="$(mktemp "$RUNNER_TEMP/realtor.XXXXXXXX")"
          trap 'rm -f "$REALTOR_SIGNING_STORE"' EXIT
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$REALTOR_SIGNING_STORE"
          unset KEYSTORE_DATA
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
          gradle --no-daemon :app:assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/RealtorAI-1.0.apk
          bash ci/verify-apk.sh ../release/RealtorAI-1.0.apk ru.vladis.realtorai 1.0 "$SIGNING_CERT_SHA256"
          (cd ../release && sha256sum RealtorAI-1.0.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: RealtorAI-1.0-production
          path: release/
          if-no-files-found: error
