name: Realtor AI APK
on:
  workflow_dispatch:
  push:
    branches: [realtorai-build-04]
    paths:
      - "realtor/**"
      - .github/workflows/realtor-android.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: realtor
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir dist
          cp realtor/app/build/outputs/apk/debug/app-debug.apk dist/RealtorAI-0.11-debug.apk
          (cd dist && sha256sum RealtorAI-0.11-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RealtorAI-0.11-Android-debug
          path: dist/
          if-no-files-found: error
      - name: Build parallel installation for owners of differently signed debug builds
        working-directory: realtor
        run: |
          gradle -PsideBySide :app:assembleDebug
          mkdir -p ../parallel
          cp app/build/outputs/apk/debug/app-debug.apk ../parallel/RealtorAI-0.11-parallel.apk
          (cd ../parallel && sha256sum RealtorAI-0.11-parallel.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RealtorAI-0.11-parallel
          path: parallel/
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Room and capture the running application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          script: bash realtor/ci/test-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealtorAI-emulator
          path: |
            captures/
            reports/
          if-no-files-found: error
